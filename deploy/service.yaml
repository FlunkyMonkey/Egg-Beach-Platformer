# LoadBalancer on a MetalLB IP so the game keeps a direct LAN address that works
# even if the tunnel or ingress-nginx is down.
#
# It is ALSO public at https://egg.vgriz.com via ingress.yaml — see that file.
# Deleting the Ingress takes it back to LAN-only; deleting this Service does not.
apiVersion: v1
kind: Service
metadata:
  name: egg-beach
  namespace: egg-beach
  labels:
    app.kubernetes.io/name: egg-beach
    app.kubernetes.io/part-of: family
spec:
  type: LoadBalancer
  loadBalancerIP: 172.18.1.231
  selector:
    app.kubernetes.io/name: egg-beach
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
