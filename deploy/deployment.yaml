apiVersion: apps/v1
kind: Deployment
metadata:
  name: egg-beach
  namespace: egg-beach
  labels:
    app.kubernetes.io/name: egg-beach
    app.kubernetes.io/part-of: family
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: egg-beach
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egg-beach
        app.kubernetes.io/part-of: family
    spec:
      # The GHCR package is private, matching the source repo. Credential lives in
      # sealedsecret-ghcr-pull.yaml, decryptable only by this cluster.
      imagePullSecrets:
        - name: ghcr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: egg-beach
      containers:
        - name: web
          # This line is rewritten by .github/workflows/deploy.yml on every push to
          # main — the tag is the commit the image was built from, so what's running
          # is always traceable to a commit and `git revert` is a real rollback.
          # Don't hand-edit it; change the code and push.
          image: ghcr.io/flunkymonkey/egg-beach-platformer:sha-f6a262479a84b351fd234fb326c879b8e46e5658
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
