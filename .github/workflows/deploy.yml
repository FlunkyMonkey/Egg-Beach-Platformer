name: Build and deploy

# Only source changes trigger a build. deploy/** is deliberately excluded so the
# image-tag commit this workflow pushes at the end cannot re-trigger it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker tags must be lowercase and the owner is "FlunkyMonkey", so
      # github.repository_owner cannot be used verbatim.
      - name: Resolve image name
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/egg-beach-platformer:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Typecheck and build
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The homelab cluster (kube1-4) is amd64 only.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the manifest at the image just built
        run: |
          set -euo pipefail
          image="${{ steps.img.outputs.ref }}"
          sed -i -E "s|^(\s*image: ).*$|\1${image}|" deploy/deployment.yaml
          grep -q "${image}" deploy/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- deploy/deployment.yaml; then
            echo "Manifest already on this image; nothing to commit."
            exit 0
          fi
          git add deploy/deployment.yaml
          git commit -m "Deploy ${GITHUB_SHA:0:7}"
          git push
